
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d18">
<title>عزيز - يضويلك حياتك</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:#080d18;
color:white;
font-family:Arial,sans-serif;
text-align:center;
padding:20px
}

.app{
width:100%;
max-width:380px
}

h1{
font-size:48px;
margin-bottom:8px;
letter-spacing:1px
}

p{
color:#9ca9bd;
font-size:19px
}

button{
width:190px;
height:190px;
border-radius:50%;
border:5px solid #26364d;
background:#17243a;
color:white;
font-size:25px;
font-weight:bold;
margin:45px 0;
cursor:pointer;
box-shadow:0 0 35px #0008;
transition:.25s
}

button.on{
background:#f5c542;
color:#172033;
box-shadow:0 0 55px #f5c54288
}

button:disabled{
opacity:.6;
cursor:wait
}

#status{
font-size:18px;
min-height:28px;
color:#cbd5e1
}

small{
color:#728097;
display:block;
margin-top:35px;
line-height:1.8
}
</style>
</head>

<body>

<div class="app">
<h1>عزيز</h1>
<p>يضويلك حياتك</p>

<button id="toggle">تشغيل</button>

<div id="status">المصباح متوقف</div>

<small>
اضغط على الزر لتشغيل أو إطفاء فلاش الهاتف
</small>
</div>

<script>
let stream=null;
let track=null;
let on=false;
let busy=false;

const button=document.getElementById("toggle");
const status=document.getElementById("status");

async function stopFlash(){

if(track){
try{
await track.applyConstraints({
advanced:[{torch:false}]
});
}catch(e){}
}

if(stream){
stream.getTracks().forEach(t=>t.stop());
}

stream=null;
track=null;
on=false;

button.textContent="تشغيل";
button.classList.remove("on");
status.textContent="المصباح متوقف";
}

async function toggleFlash(){

if(busy)return;

busy=true;
button.disabled=true;

try{

if(on){
await stopFlash();
return;
}

status.textContent="جارٍ تشغيل المصباح...";

if(!navigator.mediaDevices ||
!navigator.mediaDevices.getUserMedia){
throw new Error("المتصفح لا يدعم هذه الخاصية");
}

stream=await navigator.mediaDevices.getUserMedia({
audio:false,
video:{
facingMode:{ideal:"environment"}
}
});

track=stream.getVideoTracks()[0];

if(!track){
throw new Error("تعذر الوصول إلى كاميرا الهاتف");
}

const capabilities=track.getCapabilities();

if(!capabilities.torch){
throw new Error("الفلاش غير مدعوم في هذا المتصفح");
}

await track.applyConstraints({
advanced:[{torch:true}]
});

on=true;
button.textContent="إطفاء";
button.classList.add("on");
status.textContent="المصباح يعمل الآن 🔦";

}catch(error){

await stopFlash();

if(error.name==="NotAllowedError"){
status.textContent="يرجى السماح باستخدام الكاميرا";
}else if(error.name==="NotFoundError"){
status.textContent="لم يتم العثور على كاميرا";
}else{
status.textContent=error.message || "تعذر تشغيل الفلاش";
}

}finally{

busy=false;
button.disabled=false;

}
}

button.addEventListener("click",toggleFlash);

document.addEventListener("visibilitychange",()=>{
if(document.hidden && on){
stopFlash();
}
});

</script>
</body>
</html>
