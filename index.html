
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d18">
<title>FLASH -  عزيز يضويلك حياتك</title>
<style>
*{box-sizing:border-box}
body{
margin:0;min-height:100vh;display:flex;align-items:center;
justify-content:center;background:#080d18;color:white;
font-family:Arial,sans-serif;text-align:center;padding:20px
}
.app{width:100%;max-width:380px}
h1{font-size:42px;letter-spacing:5px;margin-bottom:8px}
p{color:#9ca9bd}
button{
width:190px;height:190px;border-radius:50%;border:5px solid #26364d;
background:#17243a;color:white;font-size:25px;font-weight:bold;
margin:45px 0;cursor:pointer;box-shadow:0 0 35px #0008
}
button.on{background:#f5c542;color:#172033;box-shadow:0 0 55px #f5c54288}
#status{font-size:18px;min-height:28px}
small{color:#728097;display:block;margin-top:35px}
</style>
</head>
<body>
<div class="app">
<h1>عزيز</h1>
<p>يضويلك حياتك</p>
<button id="toggle">تشغيل</button>
<div id="status">المصباح متوقف</div>
<small>اضغط على الزر لتشغيل أو إطفاء الفلاش</small>
</div>
<script>
let stream=null;
let track=null;
let on=false;
const button=document.getElementById("toggle");
const status=document.getElementById("status");

async function toggleFlash(){
if(on){
if(track){
try{await track.applyConstraints({advanced:[{torch:false}]});}catch(e){}
}
if(stream)stream.getTracks().forEach(t=>t.stop());
stream=null;track=null;on=false;
button.textContent="تشغيل";
button.classList.remove("on");
status.textContent="المصباح متوقف";
return;
}
try{
if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
throw new Error("المتصفح لا يدعم تشغيل الفلاش");
}
stream=await navigator.mediaDevices.getUserMedia({
audio:false,
video:{facingMode:{ideal:"environment"}}
});
track=stream.getVideoTracks()[0];
const capabilities=track.getCapabilities();
if(!capabilities.torch){
throw new Error("الفلاش غير مدعوم في هذا المتصفح");
}
await track.applyConstraints({advanced:[{torch:true}]});
on=true;
button.textContent="إطفاء";
button.classList.add("on");
status.textContent="المصباح يعمل الآن";
}catch(error){
if(stream)stream.getTracks().forEach(t=>t.stop());
stream=null;track=null;on=false;
status.textContent=error.name==="NotAllowedError"
?"يرجى السماح باستخدام الكاميرا من إعدادات الموقع"
:error.message || "تعذر تشغيل الفلاش";
}
}
button.addEventListener("click",toggleFlash);
document.addEventListener("visibilitychange",()=>{
if(document.hidden && on)toggleFlash();
});
</script>
</body>
</html>
